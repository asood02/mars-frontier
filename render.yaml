# Render blueprint — deploys the WHOLE game on one platform:
#   • mars-frontier-relay  — the WebSocket relay (a Node web service)
#   • mars-frontier-web    — the static React/Vite frontend
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → select this repo → Apply.
#   3. After the first deploy, copy the relay's URL and set the web service's
#      VITE_WS_URL to its secure form, e.g.  wss://mars-frontier-relay.onrender.com
#      then redeploy the web service (build-time env var).
#
# Note: Render free web services sleep when idle; the first connection after a
# sleep takes a few seconds to wake the relay.
services:
  - type: web
    name: mars-frontier-relay
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.mjs
    healthCheckPath: /healthz

  - type: web
    name: mars-frontier-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        sync: false # set to wss://<your-relay>.onrender.com after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
